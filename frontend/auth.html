<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Smart Exam Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-showcase">
      <p class="eyebrow">Smart Scheduling Suite</p>
      <h1>Exam Operations Platform</h1>
      <p>
        Generate conflict-aware schedules, monitor analytics, track overrides,
        and manage notifications from a single secure workspace.
      </p>
      <ul>
        <li>JWT-secured access</li>
        <li>Role-based dashboards</li>
        <li>Realtime scheduling workflow</li>
      </ul>
    </section>

    <section class="auth-card-pro">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">Sign In</button>
        <button id="tabSignup" class="auth-tab" type="button">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          Username
          <input id="loginUsername" type="text" value="admin" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="loginPassword" type="password" value="admin123" autocomplete="current-password" required />
        </label>
        <button id="loginSubmit" class="btn auth-btn" type="submit">Continue to Dashboard</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <label>
          Username
          <input id="signupUsername" type="text" minlength="3" maxlength="50" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required />
        </label>
        <label>
          Confirm Password
          <input id="signupConfirm" type="password" minlength="6" autocomplete="new-password" required />
        </label>
        <label>
          Role
          <select id="signupRole">
            <option value="STUDENT">Student</option>
            <option value="TEACHER">Teacher</option>
          </select>
        </label>
        <button id="signupSubmit" class="btn auth-btn" type="submit">Create Account</button>
      </form>

      <p class="auth-hint">
        Default admin login: <strong>admin / admin123</strong>
      </p>
      <button id="continueSessionBtn" class="btn ghost hidden" type="button">Continue with existing session</button>
      <p id="authMessage" class="auth-message"></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>

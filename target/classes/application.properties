spring.application.name=smart-exam-scheduler
server.port=8080

# MongoDB configuration (local default; override with env vars for Atlas later)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/exam_scheduler}
app.mongodb.database=${MONGODB_DATABASE:exam_scheduler}

# Health and observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.examscheduler=DEBUG

# JWT
jwt.secret=ChangeThisToAProper256BitSecretKeyForProdChangeNow
jwt.expiration-ms=86400000
